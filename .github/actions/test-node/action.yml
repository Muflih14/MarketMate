name: Test node app

description: >
  Sets up pnpm and the Node toolchain, runs the test script in the given
  working directory, and uploads the coverage summary artifact.

inputs:
  working-directory:
    required: false
    default: market-mate

  coverage-path:
    description: Coverage summary file to upload
    required: false
    default: market-mate/coverage/coverage-summary.json

  coverage-artifact-prefix:
    description: Prefix for the coverage artifact name
    required: false
    default: market-mate

  retention-days:
    description: Retention days for the coverage artifact
    required: false
    default: '7'


runs:
  using: composite
  steps:
    # pnpm/setup only installs pnpm 11+. This repo is on pnpm 10.
    - name: Set up pnpm
      uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      with:
        version: 10

    - name: Set up Node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: pnpm install --silent --ignore-scripts --fetch-timeout 600000 --frozen-lockfile

    - name: Run ${{ inputs.coverage-artifact-prefix }} tests
      working-directory: ${{ inputs.working-directory }}
      shell: bash
      run: pnpm test

    - name: Upload ${{ inputs.coverage-artifact-prefix }} coverage report
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: ${{ inputs.coverage-artifact-prefix }}-coverage-${{ github.run_id }}
        path: ${{ inputs.coverage-path }}
        retention-days: ${{ inputs.retention-days }}
        if-no-files-found: warn
