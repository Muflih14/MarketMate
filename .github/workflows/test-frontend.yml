name: CI - Frontend tests

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches:
      - develop
      - staging
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:

  # ============================================================================
  # JOB to run change detection
  changes:
    name: Frontend - Check changes
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    # Required permissions
    permissions:
      pull-requests: read
    # Set job outputs to values from filter step
    outputs:
      source: ${{ steps.filter.outputs.source }}
    steps:
      # For pull requests it's not necessary to checkout the code
      - name: Check changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          predicate-quantifier: 'some-with-excludes'
          filters: |
            source:
              - 'market-mate/**'
              - '.github/workflows/test-frontend.yml'
              - '.github/actions/test-node/**'


  # ============================================================================
  frontend-test:
    name: Frontend - Test market-mate
    runs-on: ubuntu-latest
    needs: changes
    if: |
      (github.event_name != 'pull_request' || github.event.pull_request.draft == false) &&
      needs.changes.outputs.source == 'true'
    steps:
      - name: Checkout latest commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Run tests
        uses: ./.github/actions/test-node
        timeout-minutes: 30
        with:
          working-directory: market-mate
          coverage-artifact-prefix: market-mate
          coverage-path: market-mate/coverage/coverage-summary.json

      - name: Build market-mate
        working-directory: market-mate
        run: pnpm build
